<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f7">
  <meta name="description" content="Một chiếc thư nhỏ xinh dành tặng bạn đáng yêu nhất trái đất.">
  <title>Một chiếc thư bé xinh 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --pink: #ffb6c1;
      --pink-dark: #ed8298;
      --cream: #fff0f5;
      --lemon: #fffacd;
      --ink: #765867;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 16% 20%, #fff 0 2px, transparent 3px),
        radial-gradient(ellipse at 82% 72%, #fff 0 2px, transparent 3px),
        linear-gradient(145deg, #fff8f5 0%, #fff0f5 52%, #fff9df 100%);
      background-size: 47px 47px, 61px 61px, auto;
      color: var(--ink);
      font-family: "Comfortaa", "Trebuchet MS", sans-serif;
    }

    button { font: inherit; }

    .scene {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .scene::before,
    .scene::after {
      position: absolute;
      z-index: -1;
      width: 290px;
      height: 290px;
      border: 1px solid rgb(255 182 193 / 28%);
      border-radius: 50%;
      content: "";
      animation: halo 8s ease-in-out infinite alternate;
    }

    .scene::after {
      width: 390px;
      height: 390px;
      animation-delay: -4s;
    }

    .sparkles, .confetti-layer {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      top: -12vh;
      color: #f4a4b5;
      opacity: 0;
      animation: snowfall var(--duration) linear var(--delay) infinite;
      will-change: transform, opacity;
    }

    .intro {
      position: relative;
      z-index: 1;
      display: flex;
      width: min(100% - 32px, 480px);
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 500ms ease, transform 600ms cubic-bezier(.2, .8, .2, 1);
    }

    .eyebrow {
      margin: 0 0 24px;
      color: #c38a9c;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .envelope {
      position: relative;
      width: min(76vw, 290px);
      aspect-ratio: 1.34;
      margin: 7px 0 30px;
      filter: drop-shadow(0 20px 18px rgb(192 125 146 / 18%));
      animation: bob 3.6s ease-in-out infinite;
      perspective: 800px;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 2px solid #f4a9b8;
      border-radius: 18px;
      background: linear-gradient(140deg, #ffd4dc, #ffb6c1);
    }

    .letter-peek {
      position: absolute;
      top: 3%;
      left: 10%;
      display: grid;
      width: 80%;
      height: 88%;
      place-items: start center;
      padding-top: 19px;
      border-radius: 9px 9px 2px 2px;
      background: repeating-linear-gradient(0deg, #fffdf6 0 18px, #ffe8ec 19px 20px);
      color: #e891a5;
      font-size: 1.6rem;
      transition: transform 750ms cubic-bezier(.2, .8, .2, 1);
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 0 0 16px 16px;
      background: #ffc7d1;
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
    }

    .envelope-front::before,
    .envelope-front::after {
      position: absolute;
      inset: 0;
      background: #ffdbe2;
      content: "";
    }

    .envelope-front::before { clip-path: polygon(0 0, 50% 59%, 0 100%); }
    .envelope-front::after {
      background: #ffccd6;
      clip-path: polygon(100% 0, 50% 59%, 100% 100%);
    }

    .envelope-flap {
      position: absolute;
      z-index: 2;
      inset: 0 0 auto;
      height: 64%;
      border-radius: 14px 14px 0 0;
      background: #ffb6c1;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: center top;
      transition: transform 700ms cubic-bezier(.2, .7, .3, 1);
      backface-visibility: hidden;
    }

    .seal {
      position: absolute;
      z-index: 3;
      top: 48%;
      left: 50%;
      display: grid;
      width: 45px;
      aspect-ratio: 1;
      place-items: center;
      border: 3px solid #fff6e6;
      border-radius: 50%;
      background: #ed8ca1;
      box-shadow: 0 3px 10px rgb(150 80 100 / 20%);
      color: #fff;
      font-size: 1.25rem;
      transform: translate(-50%, -50%);
      transition: opacity 300ms ease, transform 300ms ease;
    }

    .bow {
      position: absolute;
      z-index: 4;
      top: -19px;
      left: 50%;
      display: flex;
      align-items: center;
      transform: translateX(-50%);
    }

    .bow span {
      width: 29px;
      height: 22px;
      border: 3px solid #fff2dd;
      background: #f49aad;
    }

    .bow span:first-child { border-radius: 90% 15% 70% 20%; transform: rotate(14deg); }
    .bow span:last-child { border-radius: 15% 90% 20% 70%; transform: rotate(-14deg); }
    .bow i {
      z-index: 1;
      width: 12px;
      height: 12px;
      margin: 0 -2px;
      border: 2px solid #fff2dd;
      border-radius: 50%;
      background: #ed8298;
    }

    .sticker {
      position: absolute;
      z-index: 4;
      right: 15px;
      bottom: 15px;
      display: grid;
      width: 38px;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--lemon);
      font-size: 1.25rem;
      transform: rotate(10deg);
    }

    .intro h1 {
      margin: 0 0 9px;
      color: #bd788f;
      font-family: "Itim", cursive;
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      font-weight: 400;
    }

    .subtitle {
      margin: 0 0 23px;
      color: #987c8c;
      font-size: .9rem;
      line-height: 1.7;
    }

    .open-button, .close-button {
      position: relative;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffcad4, #ffadbd);
      box-shadow: 0 6px 0 #e992a5, 0 10px 20px rgb(205 126 147 / 22%);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .open-button { padding: 15px 25px; }

    .open-button:hover, .close-button:hover {
      filter: saturate(1.1);
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 9px 0 #e992a5, 0 15px 25px rgb(205 126 147 / 27%);
    }

    .open-button:active, .close-button:active {
      transform: translateY(3px) scale(.98);
      box-shadow: 0 3px 0 #e992a5;
    }

    button:focus-visible {
      outline: 3px solid #bf718b;
      outline-offset: 5px;
    }

    .hint {
      margin: 19px 0 0;
      color: #b49aaa;
      font-size: .72rem;
    }

    .overlay {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      visibility: hidden;
      place-items: center;
      overflow-y: auto;
      padding: 22px;
      background: rgb(100 68 85 / 0%);
      opacity: 0;
      transition: background 450ms ease, opacity 450ms ease, visibility 450ms;
    }

    .letter-card {
      position: relative;
      width: min(100%, 540px);
      max-height: min(86vh, 690px);
      max-height: min(86svh, 690px);
      overflow-y: auto;
      padding: clamp(28px, 7vw, 54px);
      border: 1px solid #ffe2e7;
      border-radius: 20px 8px 20px 8px;
      background-color: #fffdf6;
      background-image:
        linear-gradient(rgb(255 190 202 / 24%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 190 202 / 24%) 1px, transparent 1px);
      background-size: 24px 24px;
      box-shadow: 0 25px 75px rgb(91 54 75 / 22%);
      opacity: 0;
      transform: translateY(35px) scale(.75) rotate(-2deg);
      transition: transform 550ms cubic-bezier(.2, .8, .2, 1), opacity 400ms ease;
    }

    .letter-card::before {
      position: absolute;
      top: 14px;
      left: 50%;
      width: 14px;
      height: 14px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #ffadc0;
      box-shadow: 0 2px 5px rgb(115 70 85 / 18%);
      content: "";
      transform: translateX(-50%);
    }

    .letter-sticker {
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 1.8rem;
      transform: rotate(9deg);
    }

    .letter-label {
      margin: 12px 0 15px;
      color: #cb8b9b;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-align: center;
      text-transform: uppercase;
    }

    .letter-title {
      margin: 0 0 20px;
      color: #bc768e;
      font-family: "Itim", cursive;
      font-size: clamp(1.7rem, 6vw, 2.2rem);
      font-weight: 400;
      text-align: center;
    }

    .letter-copy {
      min-height: 8.5em;
      color: #765867;
      font-family: "Itim", cursive;
      font-size: clamp(1.2rem, 4vw, 1.45rem);
      line-height: 1.9;
    }

    .letter-copy p { margin: 0 0 12px; }

    .type-line {
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 350ms ease, transform 350ms ease;
    }

    .type-line.visible { opacity: 1; transform: translateY(0); }

    .signature {
      margin: 6px 0 25px;
      color: #cf899d;
      font-family: "Itim", cursive;
      font-size: 1.25rem;
      text-align: right;
    }

    .close-button {
      display: block;
      margin: 0 auto;
      padding: 12px 23px;
      font-size: .88rem;
    }

    .scene.is-open .intro { opacity: 0; transform: scale(.88); pointer-events: none; }
    .scene.is-open .overlay {
      visibility: visible;
      background: rgb(100 68 85 / 38%);
      opacity: 1;
    }
    .scene.is-open .letter-card { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    .scene.is-open .envelope-flap { transform: rotateX(180deg); }
    .scene.is-open .letter-peek { transform: translateY(-20%); }
    .scene.is-open .seal { opacity: 0; transform: translate(-50%, -50%) scale(.4); }

    .confetti {
      position: absolute;
      top: 48%;
      left: 50%;
      color: var(--color);
      font-size: var(--size);
      animation: burst var(--duration) cubic-bezier(.14, .75, .25, 1) var(--delay) both;
      will-change: transform, opacity;
    }

    .trail-heart {
      position: fixed;
      z-index: 8;
      pointer-events: none;
      animation: trail 850ms ease-out forwards;
      will-change: transform, opacity;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-9px) rotate(1deg); }
    }

    @keyframes halo {
      from { opacity: .35; transform: scale(.94); }
      to { opacity: .8; transform: scale(1.04); }
    }

    @keyframes snowfall {
      0% { opacity: 0; transform: translate3d(0, -5vh, 0) rotate(0); }
      12% { opacity: var(--opacity); }
      85% { opacity: var(--opacity); }
      100% { opacity: 0; transform: translate3d(var(--drift), 112vh, 0) rotate(260deg); }
    }

    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(0); }
      12% { opacity: 1; }
      75% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.8) rotate(var(--rotation)); }
    }

    @keyframes trail {
      from { opacity: .9; transform: translate(-50%, -50%) scale(.7) rotate(-10deg); }
      to { opacity: 0; transform: translate(-50%, -140%) scale(1.3) rotate(18deg); }
    }

    @media (max-width: 480px) {
      .eyebrow { margin-bottom: 20px; }
      .envelope { margin-bottom: 27px; }
      .overlay { padding: 16px; }
      .letter-card { max-height: 90svh; padding: 34px 25px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="sparkles" id="sparkles" aria-hidden="true"></div>

    <section class="intro" aria-label="Chiếc thư bí mật">
      <p class="eyebrow">✦ một món quà nhỏ dành cho bạn ✦</p>
      <div class="envelope" aria-hidden="true">
        <div class="envelope-back">
          <div class="letter-peek">♡</div>
        </div>
        <div class="envelope-front"></div>
        <div class="envelope-flap"></div>
        <div class="seal">♡</div>
        <div class="bow"><span></span><i></i><span></span></div>
        <div class="sticker">🐻</div>
      </div>
      <h1>Có thư gửi bạn nè!</h1>
      <p class="subtitle">Một chiếc thư be bé, nhưng chứa thật nhiều yêu thương ✨</p>
      <button class="open-button" id="openButton" type="button">Mở ra xem điiii! 💕</button>
      <p class="hint">Psst... thư này chỉ dành riêng cho bạn thôi đó 🌷</p>
    </section>

    <div class="overlay" id="overlay" aria-hidden="true">
      <article class="letter-card" id="letterCard" role="dialog" aria-modal="true" aria-labelledby="letterTitle" tabindex="-1">
        <span class="letter-sticker" aria-hidden="true">🐱</span>
        <p class="letter-label">♡ một chiếc thư thật ngọt ngào ♡</p>
        <h2 class="letter-title" id="letterTitle">Gửi bạn đáng yêu nhất trái đất!</h2>
        <div class="letter-copy" id="letterCopy" aria-live="polite"></div>
        <p class="signature" id="signature" hidden>Thương bạn nhiều lắm nha~ 💌</p>
        <button class="close-button" id="closeButton" type="button">Đóng thư 💌</button>
      </article>
    </div>
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      const scene = document.getElementById("scene");
      const openButton = document.getElementById("openButton");
      const closeButton = document.getElementById("closeButton");
      const overlay = document.getElementById("overlay");
      const letterCard = document.getElementById("letterCard");
      const letterCopy = document.getElementById("letterCopy");
      const signature = document.getElementById("signature");
      const sparkles = document.getElementById("sparkles");
      const confettiLayer = document.getElementById("confettiLayer");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const lines = [
        "Gửi bạn đáng yêu nhất trái đất! 💖",
        "Mong rằng hôm nay và mỗi ngày trôi qua của bạn đều ngập tràn niềm vui, ngọt ngào như kẹo sô-cô-la! 🍫",
        "Luôn mỉm cười thật tươi nha~ 🥰✨"
      ];
      const particleIcons = ["♡", "✦", "✧", "❄"];
      let isOpen = false;
      let typewriterTimers = [];
      let closeTimer;
      let lastFocusedElement;
      let audioContext;
      let lastTrailTime = 0;

      for (let i = 0; i < 24; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.textContent = particleIcons[i % particleIcons.length];
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.setProperty("--duration", `${9 + Math.random() * 12}s`);
        particle.style.setProperty("--delay", `${-Math.random() * 20}s`);
        particle.style.setProperty("--drift", `${Math.round(Math.random() * 150 - 75)}px`);
        particle.style.setProperty("--opacity", `${0.25 + Math.random() * 0.45}`);
        particle.style.fontSize = `${10 + Math.random() * 12}px`;
        sparkles.append(particle);
      }

      function playPop() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        try {
          audioContext ||= new AudioContextClass();
          if (audioContext.state === "suspended") audioContext.resume();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(620, audioContext.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(260, audioContext.currentTime + 0.12);
          gain.gain.setValueAtTime(0.16, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.13);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.14);
        } catch (error) {
          console.warn("Không thể phát hiệu ứng âm thanh:", error);
        }
      }

      function makeConfetti() {
        const icons = ["♥", "♡", "✦", "✨", "🌸"];
        const colors = ["#f08ca4", "#ffd166", "#d8a5e8", "#ffb6c1", "#f7a98b"];
        const count = reducedMotion.matches ? 12 : 42;
        for (let i = 0; i < count; i++) {
          const piece = document.createElement("span");
          piece.className = "confetti";
          piece.textContent = icons[i % icons.length];
          piece.style.setProperty("--color", colors[i % colors.length]);
          piece.style.setProperty("--size", `${12 + Math.random() * 17}px`);
          piece.style.setProperty("--x", `${Math.round(Math.random() * 1000 - 500)}px`);
          piece.style.setProperty("--y", `${Math.round(Math.random() * 850 - 400)}px`);
          piece.style.setProperty("--rotation", `${Math.round(Math.random() * 560 - 280)}deg`);
          piece.style.setProperty("--duration", `${1.6 + Math.random() * 1.4}s`);
          piece.style.setProperty("--delay", `${Math.random() * 0.35}s`);
          confettiLayer.append(piece);
          piece.addEventListener("animationend", () => piece.remove(), { once: true });
        }
      }

      function clearTypewriter() {
        typewriterTimers.forEach(window.clearTimeout);
        typewriterTimers = [];
        letterCopy.replaceChildren();
        signature.hidden = true;
      }

      function startTypewriter() {
        clearTypewriter();
        let delay = reducedMotion.matches ? 0 : 650;
        lines.forEach((text) => {
          const paragraph = document.createElement("p");
          paragraph.className = "type-line";
          letterCopy.append(paragraph);
          for (const character of Array.from(text)) {
            delay += reducedMotion.matches ? 0 : 38;
            typewriterTimers.push(window.setTimeout(() => {
              paragraph.textContent += character;
              paragraph.classList.add("visible");
            }, delay));
          }
          delay += reducedMotion.matches ? 0 : 350;
        });
        typewriterTimers.push(window.setTimeout(() => { signature.hidden = false; }, delay + 250));
      }

      function openLetter() {
        if (isOpen) return;
        isOpen = true;
        lastFocusedElement = document.activeElement;
        playPop();
        scene.classList.add("is-open");
        overlay.setAttribute("aria-hidden", "false");
        makeConfetti();
        startTypewriter();
        window.setTimeout(() => letterCard.focus(), reducedMotion.matches ? 0 : 450);
      }

      function closeLetter() {
        if (!isOpen) return;
        isOpen = false;
        window.clearTimeout(closeTimer);
        clearTypewriter();
        scene.classList.remove("is-open");
        overlay.setAttribute("aria-hidden", "true");
        closeTimer = window.setTimeout(() => {
          if (!isOpen) lastFocusedElement?.focus();
        }, reducedMotion.matches ? 0 : 500);
      }

      openButton.addEventListener("click", openLetter);
      closeButton.addEventListener("click", closeLetter);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isOpen) closeLetter();
        if (event.key === "Tab" && isOpen) {
          event.preventDefault();
          closeButton.focus();
        }
      });

      overlay.addEventListener("click", (event) => {
        if (event.target === overlay) closeLetter();
      });

      document.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch" || reducedMotion.matches) return;
        const now = performance.now();
        if (now - lastTrailTime < 70) return;
        lastTrailTime = now;
        const heart = document.createElement("span");
        heart.className = "trail-heart";
        heart.textContent = Math.random() > 0.5 ? "♡" : "✦";
        heart.style.left = `${event.clientX}px`;
        heart.style.top = `${event.clientY}px`;
        heart.style.color = Math.random() > 0.5 ? "#ed8ca1" : "#e9be60";
        heart.style.fontSize = `${11 + Math.random() * 8}px`;
        document.body.append(heart);
        heart.addEventListener("animationend", () => heart.remove(), { once: true });
      }, { passive: true });

      openButton.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "touch" || reducedMotion.matches) return;
        const rect = openButton.getBoundingClientRect();
        for (let i = 0; i < 7; i++) {
          const heart = document.createElement("span");
          heart.className = "trail-heart";
          heart.textContent = i % 2 ? "♡" : "♥";
          heart.style.left = `${rect.left + rect.width * (0.2 + Math.random() * 0.6)}px`;
          heart.style.top = `${rect.top + Math.random() * rect.height}px`;
          heart.style.color = i % 2 ? "#f0a0b1" : "#e9be60";
          heart.style.fontSize = `${13 + Math.random() * 9}px`;
          document.body.append(heart);
          heart.addEventListener("animationend", () => heart.remove(), { once: true });
        }
      });
    })();
  </script>
</body>
</html>
